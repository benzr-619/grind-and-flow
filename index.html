<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Grind &amp; Flow</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Grind &amp; Flow">
  <meta name="theme-color" content="#f8f5f0">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- ── Auth overlay — visible until a session is confirmed ── -->
<div id="auth-overlay" style="display:none">
  <div class="auth-card">
    <div class="auth-wordmark">
      Grind <span class="auth-amp">&amp;</span> Flow
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="atab-in" onclick="Auth.showTab('signin')">Sign In</button>
      <button class="auth-tab"        id="atab-up" onclick="Auth.showTab('signup')">Create Account</button>
    </div>
    <div id="auth-form"><!-- rendered by Auth.js --></div>
    <div id="auth-message" class="auth-message" style="display:none"></div>
  </div>
</div>

<div id="app" style="display:none">

  <!-- ── Topbar ── -->
  <header class="topbar">
    <div class="topbar-left">
      <nav class="tab-group tab-group-primary">
        <button class="tab tab-primary active" id="tab-tasks"    onclick="App.switchView('tasks')">Tasks</button>
        <button class="tab tab-primary"        id="tab-projects" onclick="App.switchView('projects')">Projects</button>
      </nav>
    </div>
    <div class="topbar-right">
      <div class="nav-icons">
        <button class="nav-action nav-icon" id="act-review"  onclick="App.openInboxReview()" title="Review Inbox"><i class="ti ti-list-check"></i></button>
        <button class="nav-action nav-icon" id="act-week"    onclick="App.switchView('calendar')" title="Week"><i class="ti ti-calendar-week"></i></button>
        <button class="tab nav-icon"        id="tab-archive" onclick="App.switchView('archive')" title="Archive"><i class="ti ti-archive"></i></button>
      </div>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="App.onImportFile(event)" />
      <button class="btn-icon btn-logout" onclick="Auth.handleLogout()" title="Sign out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Save banner -->
  <div class="save-banner" id="save-banner" style="display:none">
    <span>Unsaved changes</span>
    <button class="save-now-btn" onclick="App.exportData()">Export ↓</button>
    <button class="banner-dismiss" onclick="App.dismissBanner()">✕</button>
  </div>

  <!-- ── Mobile app shell — separate render path from the desktop board, hidden on desktop ── -->
  <div id="mobile-app" class="m-app">
    <header class="m-header">
      <div class="m-header-title" id="m-header-title">Now</div>
      <button class="m-header-signout" onclick="Auth.handleLogout()" title="Sign out">⌄</button>
    </header>
    <div class="m-content" id="m-content"><!-- rendered by JS --></div>
    <button class="m-fab" id="m-fab" onclick="App._mOpenCapture()" title="Capture">＋</button>
    <nav class="m-tabbar">
      <button class="m-tab active" id="m-tab-now" onclick="App._mSwitchTab('now')">
        <span class="m-tab-icon">●</span><span class="m-tab-label">Now</span>
      </button>
      <button class="m-tab" id="m-tab-projects" onclick="App._mSwitchTab('projects')">
        <span class="m-tab-icon">◇</span><span class="m-tab-label">Projects</span>
      </button>
      <button class="m-tab" id="m-tab-inbox" onclick="App._mSwitchTab('inbox')">
        <span class="m-tab-icon">✉</span><span class="m-tab-label">Inbox</span>
        <span class="m-tab-badge" id="m-inbox-badge" style="display:none"></span>
      </button>
    </nav>
  </div>

  <!-- ── Focus zone: full-screen breathing-orb overlay ── -->
  <div id="focus-zone" class="focus-zone">
    <div class="focus-meta" id="focus-meta"><!-- label, title, #focus-clock-time, sub/elapsed, boundary msg — rendered by JS --></div>
    <div class="orb-area" id="doing-cards-row"
      ondragover="App._onDoingDragOver(event)"
      ondragleave="App._onDoingDragLeave(event)"
      ondrop="App._onDoingDrop(event)">
      <div class="orb-glow" id="focus-orb-glow"></div>
      <div class="orb-wrap"><div class="orb" id="focus-orb"></div></div>
    </div>
    <section class="doing-section" id="doing-section">
      <div class="orb-controls" id="focus-orb-controls"><!-- buttons — rendered by JS --></div>
    </section>
  </div>

  <!-- ── Board ── -->
  <main class="board-section">
    <div class="board-head">
      <div class="board-head-left">
        <div class="topbar-date" id="topbar-date"></div>
        <h1 class="board-title" id="board-title">Tasks</h1>
      </div>
      <div class="board-actions" id="board-actions">
        <!-- rendered by JS -->
      </div>
    </div>
    <div id="board"></div>
  </main>

</div>
<!-- ── Inbox Review: full-screen triage overlay (desktop only) ── -->
<div id="inbox-review" class="inbox-review"><!-- rendered by App._renderInboxReview() --></div>
<div id="modal-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/grind-and-flow/sw.js', { scope: '/grind-and-flow/' });
  }
</script>
</body>
</html>
